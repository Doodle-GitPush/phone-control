<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Phone Paint — Brush</title>
  <style>
    :root { --bg: #15171c; --panel: #1e2127; --line: #2c303a; --text: #eef0f3; --muted: #9aa0ab; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
      touch-action: none; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none; }
    body { display: flex; flex-direction: column; }

    /* Paint pad (hold to draw) */
    #pad { flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
      margin: 12px; border-radius: 22px; border: 2px dashed var(--line);
      background: radial-gradient(120% 90% at 50% 30%, #20242c 0%, #181b20 100%);
      transition: border-color .12s, background .12s, transform .06s; }
    #pad.painting { border: 2px solid var(--brush, #4f8cff); border-style: solid;
      background: radial-gradient(120% 90% at 50% 30%, #232833 0%, #181b20 100%); transform: scale(.997); }
    #pad .label { text-align: center; pointer-events: none; padding: 0 24px; }
    #pad .label .big { font-size: 19px; font-weight: 650; }
    #pad .label .sub { font-size: 13.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    #pad .dotPulse { width: 12px; height: 12px; border-radius: 50%; background: var(--brush, #4f8cff);
      margin: 0 auto 14px; opacity: .35; }
    #pad.painting .dotPulse { opacity: 1; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.5); } }

    /* Controls */
    .controls { padding: 6px 12px calc(12px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
    .swatches { display: flex; gap: 10px; justify-content: space-between; }
    .swatch { width: 38px; height: 38px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; flex: 1; max-width: 46px; }
    .swatch.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgba(255,255,255,.25); }
    .swatch.eraser { background: #f7f7f8 !important; display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #888; }
    .row { display: flex; align-items: center; gap: 12px; }
    .row label { font-size: 12px; color: var(--muted); width: 58px; }
    input[type=range] { flex: 1; accent-color: var(--brush, #4f8cff); height: 28px; }
    .btns { display: flex; gap: 10px; }
    .btns button { flex: 1; font: inherit; font-size: 14px; font-weight: 600; padding: 13px;
      border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
      cursor: pointer; }
    .btns button:active { background: #262b33; }

    /* Start overlay */
    #start { position: fixed; inset: 0; z-index: 30; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 28px; text-align: center; }
    #start h1 { margin: 0; font-size: 26px; }
    #start p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; max-width: 320px; }
    #start button { font: inherit; font-size: 17px; font-weight: 700; padding: 16px 30px; border: 0;
      border-radius: 14px; background: #4f8cff; color: #fff; cursor: pointer; }
    #start .conn { font-size: 12.5px; color: var(--muted); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="pad">
    <div class="label">
      <div class="dotPulse"></div>
      <div class="big">Hold here to paint</div>
      <div class="sub">Keep your thumb down and<br />tilt the phone to move the brush.</div>
    </div>
  </div>

  <div class="controls">
    <div class="swatches" id="swatches"></div>
    <div class="row">
      <label>Size</label>
      <input type="range" id="size" min="2" max="48" value="10" />
    </div>
    <div class="row">
      <label>Aim speed</label>
      <input type="range" id="sens" min="60" max="320" value="200" />
    </div>
    <div class="btns">
      <button id="recenter">⤢ Recenter</button>
      <button id="clear">🗑 Clear board</button>
    </div>
  </div>

  <div id="start">
    <h1>🖌️ Phone Paint</h1>
    <p>Your phone becomes a paintbrush. Tilt to move, hold the pad to draw on the computer screen.</p>
    <button id="startBtn">Start painting</button>
    <div class="conn" id="conn">connecting…</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/controller.js"></script>
</body>
</html>
